# modules/code/manifest.toml — AiKit modules/code kit
# 来源: ~/agentkit/sdd (tool-map) + AiKit reorg
version = "1.0"

[[skills]]
id = "app"
category = "code"
tags = ["workflow", "guide"]
path = "modules/code/skills/app"
description = "Workflow guide (file-driven, CLI-free) — use when starting a session or task in a project. 6-stage loop — brainstorm → refine (SPEC.md) → plan (PLAN.md) → build → review → archive, routed through /init /task /archive. The four files carry all detail."

[[skills]]
id = "archive"
category = "code"
tags = ["archive", "shared"]
path = "modules/code/skills/archive"
description = "Roll up a completed phase — verify completion, mark PLAN.md done, fold decisions into SPEC.md, refresh DESIGN/HANDOFF/README/CHANGELOG only where the surface changed, then run any archival step named by the AGENTS.md workflow block (e.g. lightspec archive). Shared by both workflows."

[[skills]]
id = "init"
category = "code"
tags = ["init"]
path = "modules/code/skills/init"
description = "Scaffold the workflow file layer — AGENTS.md pointers, SPEC.md (Goal/What/Decisions), PLAN.md (phases with task checkboxes), optional DESIGN.md, HANDOFF.md on first pause. The four files carry all detail; no CLI tooling. Use to initialize a small project with the standalone workflow."

[[skills]]
id = "task"
category = "code"
tags = ["build"]
path = "modules/code/skills/task"
description = "Implement the next unfinished task from PLAN.md — locate the current phase, read the linked DESIGN.md section if present, implement, and tick the checkbox. Use for executing workflow work without proposal or validation ceremony."

[[skills]]
id = "plan"
category = "code"
tags = ["plan"]
path = "modules/code/skills/plan"
description = "Workflow planner — breaks SPEC.md into a phased PLAN.md with task checkboxes, dependency ordering, and per-task acceptance criteria. Use in the workflow after refine, before building."

[[skills]]
id = "refine"
category = "code"
tags = ["spec", "clarify"]
path = "modules/code/skills/refine"
description = "Refine a vague idea into a concrete SPEC.md using structured questioning modes (Sherlock/Poirot/Columbo). The workflow clarify convergence tool — use after brainstorm, before plan."

[[skills]]
id = "pickup"
category = "code"
tags = ["pickup", "shared"]
path = "modules/code/skills/pickup"
description = "Check sdd workflow progress and pick up work for a new session or agent. Shared by both workflows — reads the workflow block in AGENTS.md, then SPEC.md/PLAN.md/DESIGN.md/HANDOFF.md, and reports where we are and what's next. Use when starting a new session, after an interruption, or when asked \"where are we / what's next\"."

[[skills]]
id = "rest"
category = "code"
tags = ["rest", "shared"]
path = "modules/code/skills/rest"
description = "Pause in-progress work without archiving — survey per the AGENTS.md workflow block, record a parked note in PLAN.md, append HANDOFF.md, report status. Shared by both workflows. Use on pause, handoff, or session end with in-progress work."

[[skills]]
id = "upgrade"
category = "code"
tags = ["upgrade", "shared"]
path = "modules/code/skills/upgrade"
description = "Upgrade a workflow project to the default (lightspec) workflow — keep SPEC.md (Goal/What/Decisions), DESIGN.md, and HANDOFF.md; add the lightspec/ layer; migrate PLAN.md tasks into the first change's tasks.md; swap the AGENTS.md workflow block. Use when a project outgrows the file-driven flow."

[[agents]]
id = "maker"
category = "code"
tags = ["build"]
path = "modules/code/agents/maker.md"
description = "Workflow maker — implements the next PLAN.md task in thin vertical slices with ponytail minimal code and incremental verification. File-driven, no proposal gate."

[[agents]]
id = "inspector"
category = "code"
tags = ["review"]
path = "modules/code/agents/inspector.md"
description = "Workflow code reviewer — five-axis review (correctness, simplicity, scope, verification, security) of the current slice with ponytail over-engineering check. File-driven, no proposal gate."

[[agents]]
id = "conductor"
category = "code"
tags = ["orchestrate"]
path = "modules/code/agents/conductor.md"
description = "Workflow main coding agent — drives the file-driven 6-stage loop (SPEC.md/PLAN.md), dispatches maker/tester, owns the PLAN.md checkbox, requires verification before \"done\". No CLI tooling, no proposal gate."

[[agents]]
id = "slicer"
category = "code"
tags = ["plan", "review"]
path = "modules/code/agents/slicer.md"
description = "Workflow plan reviewer — checks PLAN.md slicing, dependency ordering, and testability against SPEC.md before building starts. Lightweight, file-driven, no proposal gate."

[[agents]]
id = "tester"
category = "code"
tags = ["test"]
path = "modules/code/agents/tester.md"
description = "Workflow test engineer — writes and runs tests for the current PLAN.md slice — unit, integration, and SPEC scenario validation. File-driven, no proposal gate."

[[commands]]
id = "archive"
category = "code"
tags = ["archive", "shared"]
path = "modules/code/commands/archive"
description = "Roll up a completed phase — shared by both workflows. Verify completion, mark PLAN.md done, update SPEC.md decisions and human docs (README/CHANGELOG) where the surface changed, then run any archival step named by the AGENTS.md workflow block"

[[commands]]
id = "init"
category = "code"
tags = ["init"]
path = "modules/code/commands/init"
description = "Initialize a project with the workflow — create SPEC.md, PLAN.md, AGENTS.md pointers, optional DESIGN.md. The four files carry all detail; no CLI tooling"

[[commands]]
id = "task"
category = "code"
tags = ["build"]
path = "modules/code/commands/task"
description = "Apply the next unfinished task from PLAN.md — implement, self-review, tick the checkbox. Workflow build step."

[[commands]]
id = "pickup"
category = "code"
tags = ["pickup", "shared"]
path = "modules/code/commands/pickup"
description = "Check sdd workflow progress and pick up work — shared by both workflows. Reads the workflow block in AGENTS.md (written by /init-sdd or /init), then SPEC/PLAN/DESIGN/HANDOFF, and reports where we are and what's next"

[[commands]]
id = "rest"
category = "code"
tags = ["rest", "shared"]
path = "modules/code/commands/rest"
description = "Pause in-progress work without archiving — shared by both workflows. Survey per the AGENTS.md workflow block, add a parked note to PLAN.md, append HANDOFF.md, report status"

[[commands]]
id = "upgrade"
category = "code"
tags = ["upgrade", "shared"]
path = "modules/code/commands/upgrade"
description = "Upgrade a workflow project to the default (lightspec) workflow — keep SPEC/PLAN/DESIGN/HANDOFF, add the lightspec/ layer, migrate PLAN.md tasks into the first change's tasks.md, swap the AGENTS.md workflow block"

[[commands]]
id = "refine"
category = "code"
tags = ["spec", "clarify"]
path = "modules/code/commands/refine"
description = "Converge a rough idea into a concrete SPEC.md via structured questioning"

[[commands]]
id = "plan"
category = "code"
tags = ["plan"]
path = "modules/code/commands/plan"
description = "Break SPEC.md into a phased PLAN.md with ordered, testable task checkboxes"
