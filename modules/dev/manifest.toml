# modules/dev/manifest.toml — AiKit modules/dev kit
# 代码开发工具池（不进 workflow preset）
version = "1.0"

[[skills]]
id = "api-and-interface-design"
category = "dev"
tags = ["design", "api"]
path = "modules/dev/skills/api-and-interface-design"
description = "Guides stable API and interface design. Use when designing APIs, module boundaries, or any public interface. Use when creating REST or GraphQL endpoints, defining type contracts between modules, or establishing boundaries between frontend and backend."

[[skills]]
id = "architecture-review"
category = "dev"
tags = ["review", "architecture"]
path = "modules/dev/skills/architecture-review"
description = "Deep architectural review of a platform or product — cross-references code against claims, maps failure modes, evaluates scaling bottlenecks, and produces a decision-grade handoff document with ADRs. Use when reviewing an existing system for scaling readiness, performing a CTO handoff, or auditing a codebase before a major migration."

[[skills]]
id = "aur-guides"
category = "dev"
tags = ["packaging", "aur"]
path = "modules/dev/skills/aur-guides"
description = "Master skill for AUR (Arch User Repository) package development. Dispatches to specialized sub-skills for creating PKGBUILDs, auditing packages, submitting to AUR, and more. Use when working with AUR packages, PKGBUILDs, makepkg, pacman, or any Arch Linux packaging task."

[[skills]]
id = "browser-testing-with-devtools"
category = "dev"
tags = ["test", "frontend"]
path = "modules/dev/skills/browser-testing-with-devtools"
description = "Tests in real browsers. Use when building or debugging anything that runs in a browser. Use when you need to inspect the DOM, capture console errors, analyze network requests, profile performance, or verify visual output with real runtime data via Chrome DevTools MCP."

[[skills]]
id = "ci-cd-and-automation"
category = "dev"
tags = ["ci-cd", "build"]
path = "modules/dev/skills/ci-cd-and-automation"
description = "Automates CI/CD pipeline setup. Use when setting up or modifying build and deployment pipelines. Use when you need to automate quality gates, configure test runners in CI, or establish deployment strategies."

[[skills]]
id = "code-review-and-quality"
category = "dev"
tags = ["review", "quality"]
path = "modules/dev/skills/code-review-and-quality"
description = "Conducts multi-axis code review plus three specialized modes — peer review (fresh-perspective diff review), quick review (fast opinionated quality pass), and bad-smells review (code-smell lens). Use before merging any change. Use when reviewing code written by yourself, another agent, or a human. Use when you need to assess code quality across multiple dimensions before it enters the main branch — includes PR triage, parallel lens dispatch, and layered architecture review for large changes."

[[skills]]
id = "code-simplification"
category = "dev"
tags = ["simplify"]
path = "modules/dev/skills/code-simplification"
description = "Simplifies code for clarity and maintainability without changing behavior. Use when refactoring for clarity, when code works but is harder to read, maintain, or extend than it should be, or when reviewing accumulated complexity. Invoke with /code-simplify; applies the ponytail minimal-code philosophy."

[[skills]]
id = "context-engineering"
category = "dev"
tags = ["context", "documentation"]
path = "modules/dev/skills/context-engineering"
description = "Optimizes agent context setup. Use when starting a new session, when agent output quality degrades, when switching between tasks, or when you need to configure rules files and context for a project."

[[skills]]
id = "context7"
category = "dev"
tags = ["documentation", "research"]
path = "modules/dev/skills/context7"
description = "Retrieve up-to-date documentation for software libraries, frameworks, and components via the Context7 API. This skill should be used when looking up documentation for any programming library or framework, finding code examples for specific APIs or features, verifying correct usage of library functions, or obtaining current information about library APIs that may have changed since training."

[[skills]]
id = "debugging-and-error-recovery"
category = "dev"
tags = ["debug"]
path = "modules/dev/skills/debugging-and-error-recovery"
description = "Guides systematic root-cause debugging. Use when tests fail, builds break, behavior doesn't match expectations, or you encounter any unexpected error. Use when you need a systematic approach to finding and fixing the root cause rather than guessing."

[[skills]]
id = "deprecation-and-migration"
category = "dev"
tags = ["migration", "maintain"]
path = "modules/dev/skills/deprecation-and-migration"
description = "Manages deprecation and migration. Use when removing old systems, APIs, or features. Use when migrating users from one implementation to another. Use when deciding whether to maintain or sunset existing code."

[[skills]]
id = "documentation-and-adrs"
category = "dev"
tags = ["documentation"]
path = "modules/dev/skills/documentation-and-adrs"
description = "Records decisions and documentation. Use when making architectural decisions, changing public APIs, shipping features, or when you need to record context that future engineers and agents will need to understand the codebase."

[[skills]]
id = "frontend-ui-engineering"
category = "dev"
tags = ["frontend", "design"]
path = "modules/dev/skills/frontend-ui-engineering"
description = "Builds production-quality UIs. Use when building or modifying user-facing interfaces. Use when creating components, implementing layouts, managing state, or when the output needs to look and feel production-quality rather than AI-generated."

[[skills]]
id = "git-workflow-and-versioning"
category = "dev"
tags = ["git"]
path = "modules/dev/skills/git-workflow-and-versioning"
description = "Structures git workflow practices. Use when making any code change. Use when committing, branching, resolving conflicts, or when you need to organize work across multiple parallel streams. Also covers repo status snapshotting — local vs remote sync, branches, open PRs, and working tree state."

[[skills]]
id = "performance-optimization"
category = "dev"
tags = ["performance"]
path = "modules/dev/skills/performance-optimization"
description = "Optimizes application performance. Use when performance requirements exist, when you suspect performance regressions, or when Core Web Vitals or load times need improvement. Use when profiling reveals bottlenecks that need fixing."

[[skills]]
id = "ponytail"
category = "dev"
tags = ["simplify", "ponytail"]
path = "modules/dev/skills/ponytail"
description = "Minimal code philosophy — 7-rung ladder, intensity levels, comment convention, plus audit / debt / gain / help / review workflows"

[[skills]]
id = "security-and-hardening"
category = "dev"
tags = ["security"]
path = "modules/dev/skills/security-and-hardening"
description = "Hardens code against vulnerabilities and runs adversarial red-team review (architecture conformance, stub detection, security, story gaps) that exposes weaknesses with failing tests. Use when handling user input, authentication, data storage, or external integrations, or when adversarially probing an implementation."

[[skills]]
id = "source-driven-development"
category = "dev"
tags = ["research", "verify"]
path = "modules/dev/skills/source-driven-development"
description = "Grounds every implementation decision in official documentation. Use when you want authoritative, source-cited code free from outdated patterns. Use when building with any framework or library where correctness matters."

[[skills]]
id = "test-driven-development"
category = "dev"
tags = ["test", "tdd"]
path = "modules/dev/skills/test-driven-development"
description = "Drives development with tests. Use when implementing any logic, fixing any bug, or changing any behavior. Use when you need to prove that code works, when a bug report arrives, or when you're about to modify existing functionality."

