[[skills]]
id = "defuddle"
category = "general"
tags = ["general", "reading", "clip"]
path = "modules/extra/skills/defuddle"
description = "Extract clean markdown content from web pages using Defuddle CLI, removing clutter and navigation to save tokens. Use instead of WebFetch when the user provides a URL to read or analyze, for online documentation, articles, blog posts, or any standard web page. Do NOT use for URLs ending in .md — those are already markdown, use WebFetch directly."

[[skills]]
id = "designing-agents"
category = "general"
tags = ["general", "design", "agent"]
path = "modules/extra/skills/designing-agents"
description = "Designs and writes a focused artifact another agent runs — an agent persona in agents/ or a workflow skill in skills/. Use when authoring a reviewer or specialist persona, a repeatable process skill — or when rewriting one that is under-specified, overlapping, or being ignored."

[[skills]]
id = "find-skills"
category = "general"
tags = ["general", "search", "skills"]
path = "modules/extra/skills/find-skills"
description = "Helps users discover and install agent skills when they ask questions like \"how do I do X\", \"find a skill for X\", \"is there a skill that can...\", or express interest in extending capabilities. This skill should be used when the user is looking for functionality that might exist as an installable skill."

[[skills]]
id = "meblog"
category = "general"
tags = ["general", "blog", "writing"]
path = "modules/extra/skills/meblog"
description = "Route blog tasks to sub-skills. Match triggers → dispatch. list subskills if no match."

[[skills]]
id = "mineru"
category = "general"
tags = ["general", "pdf", "ocr"]
path = "modules/extra/skills/mineru"
description = "MinerU 文档提取 — PDF/Word/PPT/Excel/图片/网页 → Markdown/HTML/LaTeX/DOCX，含表格识别、公式识别、OCR、批量处理，80+ 语言。"

[[skills]]
id = "neat-freak"
category = "general"
tags = ["general", "refactor", "cleanup"]
path = "modules/extra/skills/neat-freak"
description = "End-of-session knowledge cleanup with OCD-level rigor — reconciles project docs (CLAUDE.md, README.md, docs/) and agent memory against the code so nothing rots. Trigger: \"sync up\", \"tidy up docs\", \"整理文档\", \"同步一下\", \"/sync\"。"

[[skills]]
id = "obsidian-bases"
category = "general"
tags = ["general", "obsidian"]
path = "modules/extra/skills/obsidian-bases"
description = "Create and edit Obsidian Bases (.base files) with views, filters, formulas, and summaries. Use when working with .base files, creating database-like views of notes, or when the user mentions Bases, table views, card views, filters, or formulas in Obsidian."

[[skills]]
id = "obsidian-cli"
category = "general"
tags = ["general", "obsidian"]
path = "modules/extra/skills/obsidian-cli"
description = "Interact with Obsidian vaults using the Obsidian CLI to read, create, search, and manage notes, tasks, properties, and more. Also supports plugin and theme development with commands to reload plugins, run JavaScript, capture errors, take screenshots, and inspect the DOM."

[[skills]]
id = "obsidian-markdown"
category = "general"
tags = ["general", "obsidian", "markdown"]
path = "modules/extra/skills/obsidian-markdown"
description = "Create and edit Obsidian Flavored Markdown with wikilinks, embeds, callouts, properties, and other Obsidian-specific syntax. Use when working with .md files in Obsidian, or when the user mentions wikilinks, callouts, frontmatter, tags, embeds, or Obsidian notes."

[[skills]]
id = "paper-analysis"
category = "general"
tags = ["general", "paper"]
path = "modules/extra/skills/paper-analysis"
description = "Deep analysis of AI research papers with type-specific prompts. Covers benchmark papers, methodology papers, and survey/position/blog posts. Use when the user asks to read, analyze, review, or summarize a research paper."

[[skills]]
