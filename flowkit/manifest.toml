# flowkit/manifest.toml — AiKit flowkit kit
# 来源: ~/agentkit/sdd (tool-map) + AiKit reorg
version = "1.0"

[[skills]]
id = "app"
category = "lite"
tags = ["lite"]
path = "flowkit/skills/app"
description = "Lite workflow guide (file-driven, CLI-free) — use when starting a session or task in a lite project. 6-stage loop — brainstorm → refine (SPEC.md) → plan (PLAN.md) → build → review → archive, routed through /init /task /archive. The four files carry all detail."

[[skills]]
id = "archive"
category = "lite"
tags = ["archive", "shared"]
path = "flowkit/skills/archive"
description = "Roll up a completed phase — verify completion, mark PLAN.md done, fold decisions into SPEC.md, refresh DESIGN/HANDOFF/README/CHANGELOG only where the surface changed, then run any archival step named by the AGENTS.md workflow block (e.g. lightspec archive). Shared by the lite and default workflows."

[[skills]]
id = "init"
category = "lite"
tags = ["init", "lite"]
path = "flowkit/skills/init"
description = "Scaffold the lite workflow file layer — AGENTS.md pointers, SPEC.md (Goal/What/Decisions), PLAN.md (phases with task checkboxes), optional DESIGN.md, HANDOFF.md on first pause. The four files carry all detail; no CLI tooling. Use to initialize a small project with the standalone lite workflow."

[[skills]]
id = "brainstorm"
category = "lite"
tags = ["spec", "lite"]
path = "flowkit/skills/brainstorm"
description = "Lite workflow idea generation — diverges on a vague idea, explores the problem space, surfaces prior work, and produces a structured brainstorm note. Use in the lite clarify stage before refine (idea → SPEC.md)."

[[skills]]
id = "task"
category = "lite"
tags = ["build", "lite"]
path = "flowkit/skills/task"
description = "Implement the next unfinished task from PLAN.md — locate the current phase, read the linked DESIGN.md section if present, implement, and tick the checkbox. Use for executing lite workflow work without proposal or validation ceremony."

[[skills]]
id = "plan"
category = "lite"
tags = ["plan", "lite"]
path = "flowkit/skills/plan"
description = "Lite workflow planner — breaks SPEC.md into a phased PLAN.md with task checkboxes, dependency ordering, and per-task acceptance criteria. Use in the lite workflow after refine, before building."

[[skills]]
id = "refine"
category = "lite"
tags = ["spec", "lite"]
path = "flowkit/skills/refine"
description = "Refine a vague idea into a concrete SPEC.md using structured questioning modes (Sherlock/Poirot/Columbo). The lite workflow clarify convergence tool — use after brainstorm, before plan."

[[skills]]
id = "pickup"
category = "lite"
tags = ["pickup", "shared"]
path = "flowkit/skills/pickup"
description = "Check sdd workflow progress and pick up work for a new session or agent. Shared by the lite and default workflows — reads the workflow block in AGENTS.md, then SPEC.md/PLAN.md/DESIGN.md/HANDOFF.md, and reports where we are and what's next. Use when starting a new session, after an interruption, or when asked \"where are we / what's next\"."

[[skills]]
id = "rest"
category = "lite"
tags = ["rest", "shared"]
path = "flowkit/skills/rest"
description = "Pause in-progress work without archiving — survey per the AGENTS.md workflow block, record a parked note in PLAN.md, append HANDOFF.md, report status. Shared by the lite and default workflows. Use on pause, handoff, or session end with in-progress work."

[[skills]]
id = "upgrade"
category = "lite"
tags = ["upgrade", "shared"]
path = "flowkit/skills/upgrade"
description = "Upgrade a lite workflow project to the default (lightspec) workflow — keep SPEC.md (Goal/What/Decisions), DESIGN.md, and HANDOFF.md; add the lightspec/ layer; migrate PLAN.md tasks into the first change's tasks.md; swap the AGENTS.md workflow block. Use when a lite project outgrows the file-driven flow."

[[agents]]
id = "maker"
category = "lite"
tags = ["lite", "build"]
path = "flowkit/agents/maker.md"
description = "Lite workflow maker — implements the next PLAN.md task in thin vertical slices with ponytail minimal code and incremental verification. File-driven, no proposal gate."

[[agents]]
id = "inspector"
category = "lite"
tags = ["lite", "review"]
path = "flowkit/agents/inspector.md"
description = "Lite workflow code reviewer — five-axis review (correctness, simplicity, scope, verification, security) of the current slice with ponytail over-engineering check. File-driven, no proposal gate."

[[agents]]
id = "conductor"
category = "lite"
tags = ["lite", "orchestrate"]
path = "flowkit/agents/conductor.md"
description = "Lite workflow main coding agent — drives the file-driven 6-stage loop (SPEC.md/PLAN.md), dispatches maker/tester, owns the PLAN.md checkbox, requires verification before \"done\". No CLI tooling, no proposal gate."

[[agents]]
id = "slicer"
category = "lite"
tags = ["lite", "plan", "review"]
path = "flowkit/agents/slicer.md"
description = "Lite workflow plan reviewer — checks PLAN.md slicing, dependency ordering, and testability against SPEC.md before building starts. Lightweight, file-driven, no proposal gate."

[[agents]]
id = "tester"
category = "lite"
tags = ["lite", "test"]
path = "flowkit/agents/tester.md"
description = "Lite workflow test engineer — writes and runs tests for the current PLAN.md slice — unit, integration, and SPEC scenario validation. File-driven, no proposal gate."

[[commands]]
id = "archive"
category = "lite"
tags = ["archive", "shared"]
path = "flowkit/commands/archive.md"
description = "Roll up a completed phase — shared by the lite and default workflows. Verify completion, mark PLAN.md done, update SPEC.md decisions and human docs (README/CHANGELOG) where the surface changed, then run any archival step named by the AGENTS.md workflow block"

[[commands]]
id = "init"
category = "lite"
tags = ["init", "lite"]
path = "flowkit/commands/init.md"
description = "Initialize a project with the lite workflow — create SPEC.md, PLAN.md, AGENTS.md pointers, optional DESIGN.md. The four files carry all detail; no CLI tooling"

[[commands]]
id = "task"
category = "lite"
tags = ["build", "lite"]
path = "flowkit/commands/task.md"
description = "Apply the next unfinished task from PLAN.md — implement, self-review, tick the checkbox. Lite workflow build step."

[[commands]]
id = "pickup"
category = "lite"
tags = ["pickup", "shared"]
path = "flowkit/commands/pickup.md"
description = "Check sdd workflow progress and pick up work — shared by the lite and default workflows. Reads the workflow block in AGENTS.md (written by /init-sdd or /init), then SPEC/PLAN/DESIGN/HANDOFF, and reports where we are and what's next"

[[commands]]
id = "rest"
category = "lite"
tags = ["rest", "shared"]
path = "flowkit/commands/rest.md"
description = "Pause in-progress work without archiving — shared by the lite and default workflows. Survey per the AGENTS.md workflow block, add a parked note to PLAN.md, append HANDOFF.md, report status"

[[commands]]
id = "upgrade"
category = "lite"
tags = ["upgrade", "shared"]
path = "flowkit/commands/upgrade.md"
description = "Upgrade a lite workflow project to the default (lightspec) workflow — keep SPEC/PLAN/DESIGN/HANDOFF, add the lightspec/ layer, migrate PLAN.md tasks into the first change's tasks.md, swap the AGENTS.md workflow block"
