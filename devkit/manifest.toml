# devkit/manifest.toml — AiKit devkit kit
# 来源: ~/agentkit/sdd (tool-map) + AiKit reorg
version = "1.0"

[[skills]]
id = "advisor"
category = "dev"
tags = ["review", "advice"]
path = "devkit/skills/advisor"
description = "Second-opinion advisor — dispatches 1-2 subagents (advice + hard devil's-advocate) to review a decision, design, plan, or code before you commit to it"

[[skills]]
id = "api-and-interface-design"
category = "dev"
tags = ["design", "api"]
path = "devkit/skills/api-and-interface-design"
description = "Guides stable API and interface design. Use when designing APIs, module boundaries, or any public interface. Use when creating REST or GraphQL endpoints, defining type contracts between modules, or establishing boundaries between frontend and backend."

[[skills]]
id = "aur-guides"
category = "dev"
tags = ["packaging", "aur"]
path = "devkit/skills/aur-guides"
description = "Master skill for AUR (Arch User Repository) package development. Dispatches to specialized sub-skills for creating PKGBUILDs, auditing packages, submitting to AUR, and more. Use when working with AUR packages, PKGBUILDs, makepkg, pacman, or any Arch Linux packaging task."

[[skills]]
id = "browser-testing-with-devtools"
category = "dev"
tags = ["test", "frontend"]
path = "devkit/skills/browser-testing-with-devtools"
description = "Tests in real browsers. Use when building or debugging anything that runs in a browser. Use when you need to inspect the DOM, capture console errors, analyze network requests, profile performance, or verify visual output with real runtime data via Chrome DevTools MCP."

[[skills]]
id = "ci-cd-and-automation"
category = "dev"
tags = ["ci-cd", "build"]
path = "devkit/skills/ci-cd-and-automation"
description = "Automates CI/CD pipeline setup. Use when setting up or modifying build and deployment pipelines. Use when you need to automate quality gates, configure test runners in CI, or establish deployment strategies."

[[skills]]
id = "code-review-and-quality"
category = "dev"
tags = ["review", "quality"]
path = "devkit/skills/code-review-and-quality"
description = "Conducts multi-axis code review. Use before merging any change. Use when reviewing code written by yourself, another agent, or a human. Use when you need to assess code quality across multiple dimensions before it enters the main branch — includes PR triage, parallel lens dispatch, and layered architecture review for large changes."

[[skills]]
id = "code-simplification"
category = "dev"
tags = ["simplify"]
path = "devkit/skills/code-simplification"
description = "Simplifies code for clarity. Use when refactoring code for clarity without changing behavior. Use when code works but is harder to read, maintain, or extend than it should be. Use when reviewing code that has accumulated unnecessary complexity."

[[skills]]
id = "context-engineering"
category = "dev"
tags = ["context", "documentation"]
path = "devkit/skills/context-engineering"
description = "Optimizes agent context setup. Use when starting a new session, when agent output quality degrades, when switching between tasks, or when you need to configure rules files and context for a project."

[[skills]]
id = "context7"
category = "dev"
tags = ["documentation", "research"]
path = "devkit/skills/context7"
description = "Retrieve up-to-date documentation for software libraries, frameworks, and components via the Context7 API. This skill should be used when looking up documentation for any programming library or framework, finding code examples for specific APIs or features, verifying correct usage of library functions, or obtaining current information about library APIs that may have changed since training."

[[skills]]
id = "craft-skill"
category = "dev"
tags = ["design", "skill"]
path = "devkit/skills/craft-skill"
description = ">"

[[skills]]
id = "debugging-and-error-recovery"
category = "dev"
tags = ["debug"]
path = "devkit/skills/debugging-and-error-recovery"
description = "Guides systematic root-cause debugging. Use when tests fail, builds break, behavior doesn't match expectations, or you encounter any unexpected error. Use when you need a systematic approach to finding and fixing the root cause rather than guessing."

[[skills]]
id = "deprecation-and-migration"
category = "dev"
tags = ["migration", "maintain"]
path = "devkit/skills/deprecation-and-migration"
description = "Manages deprecation and migration. Use when removing old systems, APIs, or features. Use when migrating users from one implementation to another. Use when deciding whether to maintain or sunset existing code."

[[skills]]
id = "designing-agents"
category = "dev"
tags = ["design", "agent"]
path = "devkit/skills/designing-agents"
description = "Designs and writes a focused artifact another agent runs — an agent persona in agents/ or a workflow skill in skills/. Use when authoring a reviewer or specialist persona, a repeatable process skill — or when rewriting one that is under-specified, overlapping, or being ignored."

[[skills]]
id = "discovery"
category = "dev"
tags = ["research", "clarify"]
path = "devkit/skills/discovery"
description = "Understands user demands through structured exploration — explore/brainstorm/deep-dive modes — before planning begins."

[[skills]]
id = "documentation-and-adrs"
category = "dev"
tags = ["documentation"]
path = "devkit/skills/documentation-and-adrs"
description = "Records decisions and documentation. Use when making architectural decisions, changing public APIs, shipping features, or when you need to record context that future engineers and agents will need to understand the codebase."

[[skills]]
id = "expert-panel"
category = "dev"
tags = ["review", "analysis"]
path = "devkit/skills/expert-panel"
description = "Multi-perspective analysis — parallel analysis from different role perspectives to evaluate decisions, designs, and plans"

[[skills]]
id = "frontend-ui-engineering"
category = "dev"
tags = ["frontend", "design"]
path = "devkit/skills/frontend-ui-engineering"
description = "Builds production-quality UIs. Use when building or modifying user-facing interfaces. Use when creating components, implementing layouts, managing state, or when the output needs to look and feel production-quality rather than AI-generated."

[[skills]]
id = "git-workflow-and-versioning"
category = "dev"
tags = ["git"]
path = "devkit/skills/git-workflow-and-versioning"
description = "Structures git workflow practices. Use when making any code change. Use when committing, branching, resolving conflicts, or when you need to organize work across multiple parallel streams."

[[skills]]
id = "grill-me"
category = "dev"
tags = ["spec", "interview"]
path = "devkit/skills/grill-me"
description = "Grill the user relentlessly about a plan, decision, or idea. Use when the user wants to stress-test their thinking, or uses any 'grill' trigger phrases."

[[skills]]
id = "idea-refine"
category = "dev"
tags = ["spec", "clarify"]
path = "devkit/skills/idea-refine"
description = "Refines ideas iteratively. Refine ideas through structured divergent and convergent thinking. Use \"idea-refine\" or \"ideate\" to trigger."

[[skills]]
id = "interview-me"
category = "dev"
tags = ["spec", "interview"]
path = "devkit/skills/interview-me"
description = "Extracts what the user actually wants instead of what they think they should want. Achieves this through one-question-at-a-time interview until ~95% confidence about the underlying intent. Use when an ask is underspecified (\"build me X\" without \"for whom\" or \"why now\"), when the user explicitly invokes (\"interview me\", \"grill me\", \"are we sure?\", \"stress-test my thinking\"), or when you catch yourself silently filling in ambiguous requirements before any plan, spec, or code exists."

[[skills]]
id = "orchestrate"
