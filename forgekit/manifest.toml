# forgekit/manifest.toml — AiKit forgekit kit
# 来源: ~/agentkit/sdd (tool-map) + AiKit reorg
version = "1.0"

[[skills]]
id = "app-sdd"
category = "spec"
tags = ["lightspec"]
path = "forgekit/skills/app-sdd"
description = "Default workflow guide (lightspec-based). Use when starting a session or task in a lightspec project — routes to the right command, skill, or agent across the workflow (init → clarify → plan → code → review → archive). The four files (SPEC/PLAN/DESIGN/HANDOFF) hold the simple project-level view; per-change detail lives in lightspec/."

[[skills]]
id = "building"
category = "spec"
tags = ["build"]
path = "forgekit/skills/building"
description = "Implements code in thin vertical slices with quality checks, ponytail minimal code philosophy, and quick-fix/incremental/tdd/plan-driven modes — including plan execution, mismatch handling, and acceptance validation."

[[skills]]
id = "init-sdd"
category = "spec"
tags = ["init", "lightspec"]
path = "forgekit/skills/init-sdd"
description = "Initialize a project with the default (lightspec) workflow — creates `lightspec/` (copied workflow doc), writes `SPEC.md` and `PLAN.md`, updates `AGENTS.md` and `README.md`. The four files (SPEC/PLAN/DESIGN/HANDOFF) stay simple; detail lives in `lightspec/`. Use for a new project that needs proposal/archive discipline."

[[skills]]
id = "knowledge-capture"
category = "spec"
tags = ["archive"]
path = "forgekit/skills/knowledge-capture"
description = "Compound skill for capturing decisions, solutions, and lessons learned — stores to docs/solutions/ with dedup"

[[skills]]
id = "planning"
category = "spec"
tags = ["plan", "lightspec"]
path = "forgekit/skills/planning"
description = "Creates specs and breaks down work into tasks using lightspec, with quick-plan/spec/architecture modes — including vertical-slice decomposition for complex features."

[[skills]]
id = "planning-and-task-breakdown"
category = "spec"
tags = ["plan", "lightspec"]
path = "forgekit/skills/planning-and-task-breakdown"
description = "Breaks work into ordered tasks. Use when you have a spec or clear requirements and need to break work into implementable tasks. Use when a task feels too large to start, when you need to estimate scope, or when parallel work is possible."

[[skills]]
id = "reviewing"
category = "spec"
tags = ["review"]
path = "forgekit/skills/reviewing"
description = "Reviews code across five axes (correctness, readability, architecture, security, performance) with ponytail over-engineering check — plus fresh-perspective (blind-spot) and criteria-walk (acceptance verification) review modes."

[[skills]]
id = "shipping"
category = "spec"
tags = ["ship"]
path = "forgekit/skills/shipping"
description = "Prepares code for release with git workflow, documentation, and commit/release/audit modes."

[[skills]]
id = "spec-driven-development"
category = "spec"
tags = ["spec", "lightspec", "clarify"]
path = "forgekit/skills/spec-driven-development"
description = "Clarifies requirements and produces a concrete spec — SPEC.md (lite workflow) or a lightspec proposal (lightspec workflow). The sdd clarify stage's specification engine — use when requirements are unclear, ambiguous, or exist only as a vague idea, before planning begins."

[[skills]]
id = "spec-proposal"
category = "spec"
tags = ["spec", "lightspec"]
path = "forgekit/skills/spec-proposal"
description = "Scaffolds a new sdd change proposal — clarifies requirements, writes proposal/design/tasks/spec deltas, reviews with plan-reviewer, validates. The lightspec workflow's clarify-to-proposal entry — use for new features, changes, or any non-trivial work before implementation."

[[skills]]
id = "spec-router"
category = "spec"
tags = ["spec", "lightspec"]
path = "forgekit/skills/spec-router"
description = "Entry point for spec-driven development — interviews users, creates and validates specs using lightspec."

[[skills]]
id = "test-router"
category = "spec"
tags = ["test"]
path = "forgekit/skills/test-router"
description = "Detects project type, runs appropriate tests, validates against spec scenarios, and reports results."

