# preset.toml — Phase 1 预设（唯一真实来源）
# 根清单通过 includes 引用各 kit 的 preset.toml。
# include 合并后的 preset id 为 "<kit名>:<preset id>"；根内联 preset id 保持原样。
# full = codekit (轻) + speckit (重); extra/devkit 永不进 workcode preset。

version = "1.0"
includes = [
  "modules/paper/preset.toml",
  "modules/research/preset.toml",
  "modules/review/preset.toml",
  "modules/extra/preset.toml",
  "modules/code/preset.toml",
  "modules/spec/preset.toml",
]

[[preset]]
id = "full"
description = "codekit(轻) + speckit(重) 全工作流 — 不含 extra/devkit"
skills = ["code:pickup", "code:archive", "code:rest", "code:upgrade",
  "code:app", "code:init", "code:brainstorm", "code:refine", "code:plan", "code:task",
  "spec:app-sdd", "spec:init-sdd", "spec:spec-proposal", "spec:spec-driven-development",
  "spec:planning", "spec:planning-and-task-breakdown", "spec:building", "spec:reviewing",
  "spec:shipping", "spec:knowledge-capture"]
agents = ["code:conductor", "code:slicer", "code:maker", "code:tester", "code:inspector",
  "spec:orchestrator", "spec:planner", "spec:plan-reviewer", "spec:builder",
  "spec:code-reviewer", "spec:documenter", "spec:releaser"]
commands = ["code:pickup", "code:archive", "code:rest", "code:upgrade",
  "code:init", "code:task",
  "spec:init-sdd", "spec:spec", "spec:plan", "spec:build", "spec:test", "spec:review", "spec:ship"]
mcp = []
