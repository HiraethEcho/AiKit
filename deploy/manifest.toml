# manifest.toml — AiKit 资源清单（唯一真实来源）
# 根清单通过 includes 引用各 kit 的 manifest.toml。
# include 合并后的资源 id 为 "<kit名>:<原id>"；根清单内联资源 id 保持原样。

version = "1.0"
includes = [
  "modules/paper/manifest.toml",
  "modules/research/manifest.toml",
  "modules/review/manifest.toml",
  "modules/extra/manifest.toml",
  "modules/code/manifest.toml",
  "modules/spec/manifest.toml",
  "modules/dev/manifest.toml",
]
